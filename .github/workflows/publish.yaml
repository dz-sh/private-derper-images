name: Publish images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - derper
          - tailscale-auth

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Read upstream version
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          source upstream/version.env
          test -n "${TAILSCALE_VERSION}"
          release="${GITHUB_REF_NAME#v}"
          test -n "${release}"
          echo "version=${TAILSCALE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "release=${release}" >> "${GITHUB_OUTPUT}"

      - name: Validate deployment files
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          mkdir -p certs secrets
          : > secrets/tailscale-authkey
          docker compose config --quiet
          sh -n scripts/certbot-deploy-derper
          shellcheck scripts/certbot-deploy-derper

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TAILSCALE_VERSION=${{ steps.upstream.outputs.version }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.target }}:${{ steps.upstream.outputs.release }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
