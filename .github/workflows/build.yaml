name: Build images

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - derper
          - tailscale-auth

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Read upstream version
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          source upstream/version.env
          test -n "${TAILSCALE_VERSION}"
          test -n "${TAILSCALE_COMMIT}"
          echo "version=${TAILSCALE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "commit=${TAILSCALE_COMMIT}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          build-args: |
            TAILSCALE_VERSION=${{ steps.upstream.outputs.version }}
            TAILSCALE_COMMIT=${{ steps.upstream.outputs.commit }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
